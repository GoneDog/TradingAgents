name: Operator safety (no credentials)

on:
  pull_request:
    paths:
      - 'tradingagents/operator/**'
      - 'tests/operator_safety/**'
      - '.github/workflows/operator-safety.yml'
  push:
    branches: [unattended-operator]
    paths:
      - 'tradingagents/operator/**'
      - 'tests/operator_safety/**'
      - '.github/workflows/operator-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install 'pytest>=8,<9' 'requests>=2.32.4,<3' 'python-dotenv>=1,<2'
      - name: Run real operator code with fake transports and network blocked
        run: python -m pytest --confcutdir=tests/operator_safety tests/operator_safety -q --junitxml=operator-safety.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operator-safety-py${{ matrix.python-version }}
          path: operator-safety.xml
